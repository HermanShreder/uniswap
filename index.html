<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#0b0b0f">
  <meta name="color-scheme" content="dark">

  <title>Uniswap Interface</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          900px 500px at 50% -100px,
          rgba(255, 0, 122, 0.13),
          transparent 65%
        ),
        #0b0b0f;

      color: #fff;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 100;

      width: 100%;
      height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 28px;

      border-bottom: 1px solid rgba(255,255,255,.06);

      background: rgba(11,11,15,.82);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;

      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: linear-gradient(
        145deg,
        #ff007a,
        #ff4da6
      );

      box-shadow:
        0 5px 25px rgba(255,0,122,.28);
    }

    .brand-logo svg {
      width: 23px;
      height: 23px;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav a {
      color: #aaa;
      font-size: 15px;
      font-weight: 600;

      transition: color .2s ease;
    }

    .nav a:hover {
      color: #fff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-button {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      color: #aaa;

      background: rgba(255,255,255,.05);

      transition:
        background .2s ease,
        color .2s ease;
    }

    .icon-button:hover {
      color: #fff;
      background: rgba(255,255,255,.09);
    }

    .connect-header {
      height: 42px;

      padding: 0 17px;

      border-radius: 14px;

      color: #fff;

      background: #ff007a;

      font-size: 14px;
      font-weight: 700;

      transition:
        transform .15s ease,
        background .2s ease;
    }

    .connect-header:hover {
      background: #ff2990;
    }

    .connect-header:active {
      transform: scale(.97);
    }

    /* =========================
       MAIN
    ========================= */

    .page {
      width: 100%;
      min-height: calc(100vh - 72px);

      display: flex;
      justify-content: center;

      padding: 65px 20px 100px;
    }

    .content {
      width: 100%;
      max-width: 500px;
    }

    /* =========================
       TABS
    ========================= */

    .tabs {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 24px;

      margin-bottom: 20px;
    }

    .tab {
      position: relative;

      padding: 8px 4px;

      color: #777;

      background: transparent;

      font-size: 16px;
      font-weight: 700;
    }

    .tab.active {
      color: #fff;
    }

    .tab.active::after {
      content: "";

      position: absolute;

      left: 0;
      right: 0;
      bottom: -5px;

      height: 2px;

      border-radius: 10px;

      background: #ff007a;
    }

    /* =========================
       SWAP CARD
    ========================= */

    .swap-card {
      position: relative;

      padding: 14px;

      border: 1px solid rgba(255,255,255,.07);

      border-radius: 28px;

      background:
        linear-gradient(
          180deg,
          rgba(30,30,37,.96),
          rgba(19,19,24,.98)
        );

      box-shadow:
        0 30px 100px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.035);
    }

    .input-box {
      padding: 17px;

      border-radius: 21px;

      background: #121217;

      border: 1px solid transparent;

      transition:
        border-color .2s ease,
        background .2s ease;
    }

    .input-box:focus-within {
      border-color: rgba(255,255,255,.09);
      background: #141419;
    }

    .input-top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 13px;
    }

    .input-label {
      color: #8c8c96;

      font-size: 13px;
      font-weight: 600;
    }

    .balance {
      color: #666;

      font-size: 12px;
    }

    .input-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .amount {
      width: 100%;

      border: 0;
      outline: 0;

      background: transparent;

      color: #fff;

      font-size: 35px;
      font-weight: 500;

      letter-spacing: -1.5px;
    }

    .amount::placeholder {
      color: #4d4d54;
    }

    .token-button {
      flex-shrink: 0;

      min-width: 118px;
      height: 52px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding: 0 13px;

      border-radius: 18px;

      color: #fff;

      background: #27272f;

      font-size: 16px;
      font-weight: 700;

      transition: background .2s ease;
    }

    .token-button:hover {
      background: #303039;
    }

    .token-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .token-icon {
      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #627eea,
          #3448a8
        );

      font-size: 14px;
      font-weight: 800;
    }

    .token-icon.usdc {
      background:
        linear-gradient(
          145deg,
          #2775ca,
          #174c8c
        );
    }

    .token-arrow {
      color: #999;
      font-size: 13px;
    }

    /* =========================
       SWAP ARROW
    ========================= */

    .switch-wrap {
      position: relative;

      height: 0;

      z-index: 5;
    }

    .switch-button {
      position: absolute;

      left: 50%;
      top: -1px;

      transform: translate(-50%, -50%);

      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 4px solid #131318;

      border-radius: 14px;

      color: #fff;

      background: #28282f;

      box-shadow:
        0 5px 20px rgba(0,0,0,.35);

      transition:
        transform .2s ease,
        background .2s ease;
    }

    .switch-button:hover {
      background: #35353d;

      transform:
        translate(-50%, -50%)
        rotate(180deg);
    }

    .switch-button svg {
      width: 18px;
      height: 18px;
    }

    /* =========================
       SETTINGS
    ========================= */

    .settings {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 14px 6px 6px;
    }

    .slippage {
      color: #85858e;
      font-size: 12px;
    }

    .slippage strong {
      color: #ddd;
    }

    .settings-button {
      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      color: #999;

      background: transparent;
    }

    .settings-button:hover {
      color: #fff;
      background: rgba(255,255,255,.06);
    }

    /* =========================
       ACTION
    ========================= */

    .main-action {
      width: 100%;
      height: 64px;

      margin-top: 9px;

      border-radius: 20px;

      color: #fff;

      background: #ff007a;

      font-size: 18px;
      font-weight: 700;

      box-shadow:
        0 10px 35px rgba(255,0,122,.15);

      transition:
        transform .15s ease,
        background .2s ease,
        box-shadow .2s ease;
    }

    .main-action:hover {
      background: #ff218d;

      box-shadow:
        0 12px 42px rgba(255,0,122,.22);
    }

    .main-action:active {
      transform: scale(.985);
    }

    /* =========================
       INFO
    ========================= */

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;

      gap: 8px;

      margin-top: 12px;
    }

    .info-item {
      padding: 13px 8px;

      text-align: center;

      border-radius: 16px;

      background: rgba(255,255,255,.035);
    }

    .info-title {
      color: #666;

      font-size: 10px;
      font-weight: 600;

      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .info-value {
      margin-top: 4px;

      color: #ddd;

      font-size: 12px;
      font-weight: 700;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 18px;

      margin-top: 32px;

      color: #666;

      font-size: 12px;
    }

    .footer a:hover {
      color: #aaa;
    }

    /* =========================
       MODAL
    ========================= */

    .overlay {
      position: fixed;

      inset: 0;

      z-index: 999;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0,0,0,.65);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 420px;

      padding: 22px;

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 25px;

      background: #18181e;

      box-shadow:
        0 30px 100px rgba(0,0,0,.6);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
    }

    .close {
      width: 36px;
      height: 36px;

      border-radius: 12px;

      color: #aaa;

      background: rgba(255,255,255,.05);
    }

    .close:hover {
      color: #fff;
      background: rgba(255,255,255,.09);
    }

    .wallet-option {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 15px;

      margin-bottom: 9px;

      border-radius: 17px;

      color: #fff;

      background: #222229;

      transition: background .2s ease;
    }

    .wallet-option:hover {
      background: #2b2b33;
    }

    .wallet-name {
      display: flex;
      align-items: center;
      gap: 12px;

      font-size: 15px;
      font-weight: 600;
    }

    .wallet-logo {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: #fff;

      color: #111;

      font-weight: 800;
    }

    .wallet-status {
      color: #777;
      font-size: 12px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 768px) {

      .header {
        height: 62px;

        padding: 0 14px;
      }

      .brand {
        font-size: 17px;
      }

      .brand-logo {
        width: 30px;
        height: 30px;
      }

      .nav {
        display: none;
      }

      .header-actions {
        gap: 7px;
      }

      .icon-button {
        width: 38px;
        height: 38px;
      }

      .connect-header {
        height: 38px;
        padding: 0 13px;
      }

      .page {
        min-height: calc(100vh - 62px);

        padding:
          35px 12px
          calc(40px + env(safe-area-inset-bottom));
      }

      .content {
        max-width: 100%;
      }

      .swap-card {
        padding: 10px;

        border-radius: 23px;
      }

      .input-box {
        padding: 15px;

        border-radius: 18px;
      }

      .amount {
        font-size: 29px;
      }

      .token-button {
        min-width: 108px;
        height: 48px;

        border-radius: 16px;
      }

      .token-icon {
        width: 28px;
        height: 28px;
      }

      .main-action {
        height: 59px;

        border-radius: 18px;
      }
    }

    @media (max-width: 390px) {

      .header {
        padding: 0 10px;
      }

      .brand span {
        display: none;
      }

      .input-row {
        gap: 5px;
      }

      .amount {
        font-size: 26px;
      }

      .token-button {
        min-width: 101px;
        padding: 0 10px;
      }

      .info {
        grid-template-columns: 1fr;
      }

      .info-item {
        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 11px 14px;
      }

      .info-value {
        margin-top: 0;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <a href="#" class="brand">

      <div class="brand-logo">

        <svg
          viewBox="0 0 32 32"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M16 3L6 16L16 29L26 16L16 3Z"
            fill="white"
            opacity=".95"
          />

          <path
            d="M16 3V29L26 16L16 3Z"
            fill="white"
            opacity=".65"
          />
        </svg>

      </div>

      <span>Uniswap</span>

    </a>


    <nav class="nav">

      <a href="#">Trade</a>
      <a href="#">Explore</a>
      <a href="#">Pool</a>

    </nav>


    <div class="header-actions">

      <button
        class="icon-button"
        id="themeButton"
        aria-label="Theme"
      >
        ☼
      </button>

      <button
        class="connect-header"
        id="connectButton"
      >
        Connect
      </button>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="page">

    <div class="content">

      <div class="tabs">

        <button
          class="tab active"
          type="button"
        >
          Swap
        </button>

        <button
          class="tab"
          type="button"
        >
          Limit
        </button>

      </div>


      <section class="swap-card">

        <!-- FROM -->

        <div class="input-box">

          <div class="input-top">

            <span class="input-label">
              You pay
            </span>

            <span class="balance">
              Balance: —
            </span>

          </div>


          <div class="input-row">

            <input
              class="amount"
              id="fromAmount"
              type="number"
              inputmode="decimal"
              placeholder="0"
              autocomplete="off"
            >


            <button
              class="token-button"
              id="fromToken"
              type="button"
            >

              <span class="token-left">

                <span class="token-icon">
                  Ξ
                </span>

                <span>ETH</span>

              </span>

              <span class="token-arrow">
                ▾
              </span>

            </button>

          </div>

        </div>


        <!-- SWITCH -->

        <div class="switch-wrap">

          <button
            class="switch-button"
            id="switchButton"
            type="button"
            aria-label="Switch tokens"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7 7h11l-3-3"/>
              <path d="M18 7l-3 3"/>
              <path d="M17 17H6l3 3"/>
              <path d="M6 17l3-3"/>
            </svg>

          </button>

        </div>


        <!-- TO -->

        <div class="input-box">

          <div class="input-top">

            <span class="input-label">
              You receive
            </span>

            <span class="balance">
              Balance: —
            </span>

          </div>


          <div class="input-row">

            <input
              class="amount"
              id="toAmount"
              type="text"
              placeholder="0"
              readonly
            >


            <button
              class="token-button"
              id="toToken"
              type="button"
            >

              <span class="token-left">

                <span class="token-icon usdc">
                  $
                </span>

                <span>USDC</span>

              </span>

              <span class="token-arrow">
                ▾
              </span>

            </button>

          </div>

        </div>


        <!-- SETTINGS -->

        <div class="settings">

          <span class="slippage">
            Slippage: <strong>0.5%</strong>
          </span>

          <button
            class="settings-button"
            id="settingsButton"
            type="button"
            aria-label="Settings"
          >
            ⚙
          </button>

        </div>


        <!-- ACTION -->

        <button
          class="main-action"
          id="swapButton"
          type="button"
        >
          Connect wallet
        </button>


        <!-- INFO -->

        <div class="info">

          <div class="info-item">

            <div class="info-title">
              Network
            </div>

            <div class="info-value">
              Ethereum
            </div>

          </div>


          <div class="info-item">

            <div class="info-title">
              Fee
            </div>

            <div class="info-value">
              0.25%
            </div>

          </div>


          <div class="info-item">

            <div class="info-title">
              Route
            </div>

            <div class="info-value">
              Auto
            </div>

          </div>

        </div>

      </section>


      <footer class="footer">

        <a href="#">
          Docs
        </a>

        <a href="#">
          Help
        </a>

        <a href="#">
          Terms
        </a>

        <span>
          Uniswap Interface
        </span>

      </footer>

    </div>

  </main>


  <!-- =========================
       WALLET MODAL
  ========================== -->

  <div
    class="overlay"
    id="walletModal"
  >

    <div class="modal">

      <div class="modal-head">

        <div class="modal-title">
          Connect wallet
        </div>

        <button
          class="close"
          id="closeModal"
          type="button"
        >
          ×
        </button>

      </div>


      <button
        class="wallet-option"
        id="metamaskButton"
        type="button"
      >

        <span class="wallet-name">

          <span class="wallet-logo">
            M
          </span>

          MetaMask

        </span>

        <span class="wallet-status">
          Connect
        </span>

      </button>


      <button
        class="wallet-option"
        id="browserWalletButton"
        type="button"
      >

        <span class="wallet-name">

          <span class="wallet-logo">
            W
          </span>

          Browser wallet

        </span>

        <span class="wallet-status">
          Connect
        </span>

      </button>

    </div>

  </div>


  <script>
    /*
      ==========================================================
      BASIC INTERFACE SCRIPT
      ==========================================================
    */

    const connectButton =
      document.getElementById("connectButton");

    const swapButton =
      document.getElementById("swapButton");

    const walletModal =
      document.getElementById("walletModal");

    const closeModal =
      document.getElementById("closeModal");

    const metamaskButton =
      document.getElementById("metamaskButton");

    const browserWalletButton =
      document.getElementById("browserWalletButton");

    const switchButton =
      document.getElementById("switchButton");

    const fromAmount =
      document.getElementById("fromAmount");

    const toAmount =
      document.getElementById("toAmount");

    const fromToken =
      document.getElementById("fromToken");

    const toToken =
      document.getElementById("toToken");


    /*
      OPEN WALLET MODAL
    */

    function openWalletModal() {
      walletModal.classList.add("show");
    }


    /*
      CLOSE WALLET MODAL
    */

    function closeWalletModal() {
      walletModal.classList.remove("show");
    }


    connectButton.addEventListener(
      "click",
      openWalletModal
    );


    swapButton.addEventListener(
      "click",
      openWalletModal
    );


    closeModal.addEventListener(
      "click",
      closeWalletModal
    );


    walletModal.addEventListener(
      "click",
      function(event) {

        if (event.target === walletModal) {
          closeWalletModal();
        }

      }
    );


    /*
      SWITCH TOKENS
    */

    let switched = false;


    switchButton.addEventListener(
      "click",
      function() {

        switched = !switched;

        const fromHtml =
          fromToken.innerHTML;

        const toHtml =
          toToken.innerHTML;

        fromToken.innerHTML =
          toHtml;

        toToken.innerHTML =
          fromHtml;

        const fromValue =
          fromAmount.value;

        const toValue =
          toAmount.value;

        fromAmount.value =
          toValue;

        toAmount.value =
          fromValue;

      }
    );


    /*
      SIMPLE DEMO CALCULATION

      This only updates the interface.
      It does NOT execute a blockchain transaction.
    */

    fromAmount.addEventListener(
      "input",
      function() {

        const value =
          parseFloat(fromAmount.value);

        if (!value || value <= 0) {
          toAmount.value = "";
          return;
        }

        /*
          Demo exchange rate.
          Replace this section with a real
          Uniswap quote/API when connecting
          the actual swap functionality.
        */

        const rate = switched
          ? 1800
          : 1800;

        toAmount.value =
          (value * rate).toFixed(2);

      }
    );


    /*
      WALLET CONNECTION
    */

    async function connectWallet() {

      if (
        typeof window.ethereum === "undefined"
      ) {

        alert(
          "Web3 wallet не найден. Установи MetaMask или открой сайт в браузере с поддержкой кошелька."
        );

        return;

      }


      try {

        const accounts =
          await window.ethereum.request({
            method: "eth_requestAccounts"
          });


        if (
          accounts &&
          accounts.length > 0
        ) {

          const address =
            accounts[0];

          const shortAddress =
            address.slice(0, 6) +
            "..." +
            address.slice(-4);


          connectButton.textContent =
            shortAddress;

          swapButton.textContent =
            "Swap";


          closeWalletModal();

        }

      } catch (error) {

        console.error(
          "Wallet connection error:",
          error
        );

      }

    }


    metamaskButton.addEventListener(
      "click",
      connectWallet
    );


    browserWalletButton.addEventListener(
      "click",
      connectWallet
    );


    /*
      TOKEN BUTTONS
    */

    fromToken.addEventListener(
      "click",
      function() {

        alert(
          "Выбор токена можно подключить к реальному token list."
        );

      }
    );


    toToken.addEventListener(
      "click",
      function() {

        alert(
          "Выбор токена можно подключить к реальному token list."
        );

      }
    );


    /*
      ESC CLOSE MODAL
    */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {
          closeWalletModal();
        }

      }
    );


    /*
      PREVENT EMPTY SUBMIT BEHAVIOR
    */

    document.addEventListener(
      "click",
      function(event) {

        const link =
          event.target.closest("a[href='#']");

        if (link) {
          event.preventDefault();
        }

      }
    );

  </script>

</body>
</html>
